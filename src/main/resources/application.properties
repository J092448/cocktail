spring.application.name=cocktail
server.port=80


spring.web.resources.static-locations=classpath:/static/, file:///C:/cocktail_bar/images/


spring.datasource.url=jdbc:mysql://192.168.0.24:3306/cocktail_bar_erp?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
spring.datasource.username=ontherocks
spring.datasource.password=1111
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# MyBatis
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.type-aliases-package=com.ontherocks.cocktail.dto


logging.level.root=INFO


logging.level.com.ontherocks=DEBUG
logging.level.org.apache.ibatis=debug
logging.level.org.springframework=debug
logging.level.org.springframework.security=DEBUG

server.servlet.encoding.enabled=true
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true


