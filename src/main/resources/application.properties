spring.application.name=cocktail

# ?? ?? ??
server.port=80

# MySQL ?? ??
spring.datasource.url=jdbc:mysql://192.168.0.24:3306/cocktail_bar_erp?characterEncoding=UTF-8&serverTimezone=Asia/Seoul
spring.datasource.username=ontherocks
spring.datasource.password=1111
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Thymeleaf ??
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false

# ?? ??? ?? ??
spring.web.resources.static-locations=classpath:/static/,classpath:/templates/
spring.web.resources.add-mappings=true

# Spring MVC ??
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.html
spring.mvc.contentnegotiation.favor-path-extension=false

# ?? ?? ??
logging.level.root=INFO
logging.level.com.ontherocks=DEBUG
logging.level.org.apache.ibatis=DEBUG
logging.level.org.springframework=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG

# Hibernate (JPA) ??
#spring.jpa.hibernate.ddl-auto=update  # ?????? ?? ?? ?? (?? ? ?? ??)
#spring.jpa.show-sql=true  # SQL ?? ?? (?? ? ?? ??)
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL5InnoDBDialect

# MyBatis ??
mybatis.mapper-locations=classpath:mappers/**/*.xml
mybatis.type-aliases-package=com.ontherocks.cocktail.model
mybatis.configuration.map-underscore-to-camel-case=true

# CORS ??
spring.web.cors.allow-credentials=true

# Spring Boot 3.2+ ??
spring.mvc.problemdetails.enabled=true
server.error.include-message=always
server.error.whitelabel.enabled=false

# JSON ??
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.default-property-inclusion=non_null

# JMS ??
spring.jms.pub-sub-domain=true

# Actuator ??
management.endpoints.web.exposure.include=mappings

# JPA ?? (?? ??? ??)
#spring.jpa.hibernate.ddl-auto=update
#spring.jpa.show-sql=true

# MyBatis ?? ??
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# ?? ??? ??
server.servlet.encoding.enabled=true
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
