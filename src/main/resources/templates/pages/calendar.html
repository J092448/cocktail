<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <!-- ✅ 문서 기본 설정 -->
  <meta charset="UTF-8" /> <!-- UTF-8 문자 인코딩을 설정 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" /> <!-- 반응형 웹 설정 -->
  <title>캘린더와 사이드바</title> <!-- 페이지 제목 -->

  <!-- ✅ 외부 CSS 파일 연결 (Thymeleaf 경로 처리) -->
  <link rel="stylesheet" th:href="@{/css/calendar.css}" />

  <!-- ✅ 외부 JavaScript 라이브러리 로드 -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"
          integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
          crossorigin="anonymous"></script> <!-- jQuery 라이브러리 -->
</head>
<body>
<!-- ✅ 사이드바: 내비게이션 메뉴 -->
<aside>
  <div>
    <div class="menu-item"><a href="/dashboard">홈으로</a></div> <!-- 홈 메뉴 -->
    <div class="menu-item">
      <a href="#"></a>
    </div>
    <div class="menu-item">
      <a href="/dashboard">대시보드</a> <!-- 대시보드 메뉴 -->
    </div>
    <div class="menu-item">
      <a href="/employees">인사관리</a> <!-- 인사관리 메뉴 -->
    </div>
    <div class="menu-item">
      <a href="/sales">판매</a> <!-- 판매 메뉴 -->
    </div>
    <div class="menu-item">
      <a href="/calendar">회계</a> <!-- 회계 메뉴 -->
      <div class="submenu">
        <a href="#" onclick="window.location.reload();">매출</a> <!-- 매출 서브메뉴: 페이지 새로고침 -->
        <a th:href="@{calculate}">정산</a> <!-- 정산 서브메뉴: 다른 페이지 이동 -->
      </div>
    </div>
  </div>
  <a href="/confirmPw" style="margin-top: 500px;">정보수정</a>
  <form action="/logout" method="post" style="display:inline;">
    <button type="submit" style="background:none; border:none; color:white; cursor:pointer;">로그아웃</button>
  </form>
  <footer>
    <div>문의사항: admin1@gmail.com</div> <!-- 푸터: 연락 이메일 표시 -->
  </footer>
</aside>

<!-- ✅ 메인 콘텐츠 영역 -->
<div class="content">
  <!-- ✅ 캘린더 헤더 -->
  <div id="calendar-header">
    <!-- 이전/다음 달 버튼 -->
    <button id="prev" onclick="changeMonth(-1)">◀</button> <!-- 이전 달로 이동 -->
    <div id="month-year" class="month-year">2025년 1월</div> <!-- 현재 연도와 월 표시 -->
    <button id="next" onclick="changeMonth(1)">▶</button> <!-- 다음 달로 이동 -->
  </div>
  <!-- ✅ 캘린더 본체 -->
  <div id="calendar"></div> <!-- 동적으로 생성될 캘린더 테이블 -->
</div>

<!-- ✅ JavaScript 파일 포함 (Thymeleaf 경로 처리) -->
<script th:src="@{/js/calendar.js}"></script> <!-- 캘린더 관련 스크립트 -->
</body>
</html>
