<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>거래 업체 목록</title>
  <link rel="stylesheet" th:href="@{/css/tradeCompanyList.css}" />
</head>
<body>
<aside>
  <div>
    <div class="menu-item"><a href="/dashboard">홈으로</a></div>
    <div class="menu-item">
      <a href="/sales">판매</a>
      <div class="submenu"><a href="#">메뉴 목록</a><a href="#">재고 목록</a></div>
    </div>
    <div class="menu-item">
      <a href="/tradeCompanyList">거래 업체</a>
      <div class="submenu">
        <a href="/tradeCompanyList" onclick="window.location.reload();">거래 업체 목록</a>
        <a href="/newTradeCompany">거래 업체 등록</a>
      </div>
    </div>
    <div class="menu-item">
      <a href="/purchase/list">발주</a>
      <div class="submenu">
        <a href="/purchase/list">발주 목록</a>
        <a href="/purchase/orderingFrm">발주 신청</a> <!-- 경로 변경 -->
      </div>
    </div>
  </div>
  <a href="/confirmPw" style="margin-top: 500px;">정보 수정</a>
  <form action="/logout" method="post" style="display:inline;">
    <button type="submit" style="background:none; border:none; color:white; cursor:pointer;">로그아웃</button>
  </form>
  <footer><div>문의사항: admin1@gmail.com</div></footer>
</aside>
<div class="main-content">
  <h1 class="centered-title">거래 업체 목록</h1>
  <table id="companyTable">
    <thead>
    <tr>
      <th>업체번호</th>
      <th>업체명</th>
      <th>등록/수정일자</th>
      <th>거래품목</th>
      <th>대표자</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="company : ${suppliers}">
      <td><a href="/tradeCompanyDetail?supplierId=${company.supplierId}">${company.supplierId}</a></td>
      <td th:text="${company.companyName}"></td>
      <td>${company.updatedDate ? new Date(company.updatedDate).toLocaleDateString() : 'N/A'}</td>
      <td th:text="${company.categoryName}"></td>
      <td th:text="${company.representativeName}"></td>
    </tr>
    </tbody>
  </table>
  <div id="pagination"></div>
</div>

<script>
  document.addEventListener("DOMContentLoaded", async () => {
    let companies = [];
    const rowsPerPage = 10;
    let currentPage = 1;

    // 페이지 로드 시 서버에서 렌더링된 데이터 사용
    const initialCompanies = /*[[${suppliers}]]*/ []; // 서버에서 렌더링된 데이터
    companies = initialCompanies.length > 0 ? initialCompanies : companies;

    function updateTable() {
      displayTablePage(currentPage);
      displayPagination();
    }

    async function fetchCompanies() {
      console.log("fetchCompanies 함수 호출됨");
      try {
        const response = await fetch("/api/suppliers");
        if (!response.ok) {
          throw new Error("Network response was not ok");
        }
        const data = await response.json();
        console.log("API 응답 데이터:", data); // API 응답 데이터 확인
        companies = data;
        console.log("companies 배열:", companies);
      } catch (error) {
        console.error("Error fetching companies:", error);
        companies = [];
      } finally {
        updateTable(); // 테이블 업데이트 호출
        displayPagination(); // 페이지네이션 업데이트 호출
      }
    }

    function displayTablePage(page) {
      if (!companies || companies.length === 0) {
        const tableBody = document.querySelector("#companyTable tbody");
        tableBody.innerHTML = ""; // 테이블 비우기
        const emptyMessageRow = document.createElement("tr");
        const emptyMessageCell = document.createElement("td");
        emptyMessageCell.colSpan = 5;
        emptyMessageCell.textContent = "등록된 업체가 없습니다.";
        emptyMessageCell.classList.add("empty-message");
        emptyMessageRow.appendChild(emptyMessageCell);
        tableBody.appendChild(emptyMessageRow);
        return; // 더 이상 진행하지 않음
      }

      companies.sort((a, b) => parseInt(b.supplierId) - parseInt(a.supplierId));
      const start = (page - 1) * rowsPerPage;
      const end = start + rowsPerPage;
      const paginatedCompanies = companies.slice(start, end);
      const tableBody = document.querySelector("#companyTable tbody");
      tableBody.innerHTML = "";

      paginatedCompanies.forEach((company) => {
        const row = document.createElement("tr");
        row.innerHTML = `
                <td><a href="/tradeCompanyDetail?supplierId=${company.supplierId}">${company.supplierId}</a></td>
                <td>${company.companyName}</td>
                <td>${company.updatedDate ? new Date(company.updatedDate).toLocaleDateString() : 'N/A'}</td>
                <td>${company.categoryName || 'N/A'}</td>
                <td>${company.representativeName}</td>
                `;
        tableBody.appendChild(row);
      });
    }

    function displayPagination() {
      const pagination = document.getElementById("pagination");
      pagination.innerHTML = "";
      const totalPages = Math.ceil(companies.length / rowsPerPage);
      const startPage = Math.floor((currentPage - 1) / 10) * 10 + 1;
      const endPage = Math.min(startPage + 9, totalPages);

      const prevButton = document.createElement("button");
      prevButton.textContent = "이전";
      prevButton.classList.add("prev");
      prevButton.addEventListener("click", () => {
        if (currentPage > 1) {
          currentPage--;
          updateTable();
        }
      });
      pagination.appendChild(prevButton);

      for (let i = startPage; i <= endPage; i++) {
        const button = document.createElement("button");
        button.textContent = i;
        button.classList.add("page");
        if (i === currentPage) {
          button.disabled = true;
        }
        button.addEventListener("click", () => {
          currentPage = i;
          updateTable();
        });
        pagination.appendChild(button);
      }

      const nextButton = document.createElement("button");
      nextButton.textContent = "다음";
      nextButton.classList.add("next");
      nextButton.addEventListener("click", () => {
        if (currentPage < totalPages) {
          currentPage++;
          updateTable();
        }
      });
      pagination.appendChild(nextButton);

      const applyCompanyButton = document.createElement("button");
      applyCompanyButton.textContent = "업체 등록";
      applyCompanyButton.classList.add("apply-company");
      applyCompanyButton.addEventListener("click", () => {
        window.location.href = "/newTradeCompany"; // newTradeCompany.html로 이동
      });
      pagination.appendChild(applyCompanyButton);

      if (companies.length === 0) {
        const button = document.createElement("button");
        button.textContent = 1;
        button.classList.add("page");
        button.disabled = true;
        pagination.insertBefore(button, nextButton);
      }
    }

    updateTable(); // 초기 테이블 업데이트
    await fetchCompanies(); // API에서 데이터 가져오기
  });
</script>
</body>
</html>
