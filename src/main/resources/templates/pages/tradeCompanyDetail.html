<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>거래 업체 상세 정보</title>
  <link rel="stylesheet" th:href="@{/css/tradeCompanyDetail.css}" />
</head>
<body>
<aside>
  <div>
    <div class="menu-item"><a href="/dashboard">홈으로</a></div>
    <div class="menu-item"><a href="/sales">판매</a>
      <div class="submenu"><a href="#">메뉴 목록</a><a href="#">재고 목록</a></div>
    </div>
    <div class="menu-item"><a href="/tradeCompanyList">거래 업체</a>
      <div class="submenu">
        <a href="/tradeCompanyList">거래 업체 목록</a>
        <a href="/newTradeCompany">거래 업체 등록</a>
      </div>
    </div>
    <div class="menu-item">
      <a href="/purchase/list">발주</a>
      <div class="submenu">
        <a href="/purchase/list">발주 목록</a>
        <a href="/purchase/orderingFrm">발주 신청</a> <!-- 경로 변경 -->
      </div>
    </div>
  </div>
  <a href="/confirmPw" style="margin-top: 500px;">정보 수정</a>
  <form action="/logout" method="post" style="display:inline;">
    <button type="submit" style="background:none; border:none; color:white; cursor:pointer;">로그아웃</button>
  </form>
  <footer><div>문의사항: admin1@gmail.com</div></footer>
</aside>

<div class="wrapper">
  <div class="container">
    <div class="header">
      <h1>거래 업체 상세 정보</h1>
      <hr class="title-underline" />
      <table>
        <thead>
        <tr>
          <th class="medium-grey-background">업체 번호</th>

          <td colspan="3" th:text="${supplier.supplierId}">N/A
            <input type="hidden" name="supplierId" th:value="${supplier.supplierId}" />

          </td>
          <th class="medium-grey-background">업체 등록일자</th>
          <td colspan="3" th:text="${supplier.registrationDate}">N/A</td>
        </tr>
        <tr>
          <th class="medium-grey-background">거래 품목</th>
          <td colspan="3" th:text="${supplier.categoryName}">N/A</td>
          <th class="medium-grey-background">업체정보 수정일자</th>
          <td colspan="3" th:text="${supplier.updatedDate}">N/A</td>
        </tr>
        <tr>
          <th class="medium-grey-background" rowspan="6">거래업체정보</th>
          <th class="medium-grey-background">업체명</th>
          <td colspan="4" th:text="${supplier.companyName}">N/A</td>
        </tr>
        <tr>
          <th class="medium-grey-background">업체명(영문)</th>
          <td colspan="4" th:text="${supplier.companyEName}">N/A</td>
        </tr>
        <tr>
          <th class="medium-grey-background">사업자 번호</th>
          <td colspan="4" th:text="${supplier.businessNumber}">N/A</td>
        </tr>
        <tr>
          <th class="medium-grey-background">대표자 이름</th>
          <td colspan="4" th:text="${supplier.representativeName}">N/A</td>
        </tr>
        <tr>
          <th class="medium-grey-background">휴대전화</th>
          <td colspan="4" th:text="${supplier.phone}">N/A</td>
        </tr>
        <tr>
          <th class="medium-grey-background">전화번호</th>
          <td colspan="4" th:text="${supplier.comPhone}">N/A</td>
        </tr>
        <tr>
          <th class="medium-grey-background" colspan="6">거래 품목</th>
        </tr>
        <tr>
          <th class="medium-grey-background" colspan="2">NO.</th>
          <th class="medium-grey-background" colspan="2">품목명</th>
          <th class="medium-grey-background" colspan="2">단가</th>
        </tr>
        <tr th:each="product, iterStat : ${supplier.products}">
          <td colspan="2" th:text="${iterStat.index + 1}">1</td>
          <td colspan="2" th:text="${product.name}">N/A</td>
          <td colspan="2" th:text="${product.price} + '원'">N/A</td>
        </tr>
        <tr th:if="${#lists.isEmpty(supplier.products)}">
          <td colspan="3">등록된 품목이 없습니다.</td>
        </tr>

        </thead>
      </table>
    </div>
  </div>
  <!-- 정보 수정 및 삭제 버튼 -->
  <div class="button-container">
  <button id="delete-button" th:data-supplier-id="${supplier.supplierId}">업체 삭제</button>
  <button id="edit-button" th:data-supplier-id="${supplier.supplierId}">정보 수정</button>
</div>
</div>



<script>
  // 삭제 버튼의 이벤트 리스너 추가
  document.getElementById("delete-button").addEventListener("click", function () {
    const supplierId = this.getAttribute("data-supplier-id"); // data-supplier-id에서 ID 가져오기
    if (confirm(`정말 해당 거래 업체를 삭제하시겠습니까?`)) {
      fetch(`/api/suppliers/${supplierId}`, { method: 'DELETE' })
              .then(response => {
                if (response.ok) {
                  window.location.href = "/tradeCompanyList"; // 삭제 후 목록으로 이동
                } else {
                  alert("삭제 실패");
                }
              });
    }
  });

  // 수정 버튼의 이벤트 리스너 추가
  document.getElementById("edit-button").addEventListener("click", function () {
    const supplierId = this.getAttribute("data-supplier-id"); // data-supplier-id에서 ID 가져오기
    window.location.href = `/tradeCompanyDetailEdit?supplierId=${supplierId}`; // 수정 페이지로 이동
  });
</script>


</body>
</html>
