<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>메뉴 상세페이지</title>
    <link rel="stylesheet" type="text/css" href="/css/csStayle.css">
</head>
<body>
<div class="menu-detail">
    <img id="menu-image" src="" alt="메뉴 이미지">
    <h2 id="menu-name">메뉴명</h2>
    <p id="menu-description">메뉴 설명</p>
    <p id="menu-price">가격</p>
</div>

<button class="back-btn" onclick="goBack()">
    <span class="arrow"></span>
</button>

<div class="header">
    <button class="order-button" onclick="goList()">주문내역</button>
</div>

<div class="horizontal-line"></div>

<div class="footer">
    <button class="cart-button" onclick="addToCart()">장바구니 담기</button>
</div>

<script>
    // URL 파라미터에서 'cocktail' 값을 읽어오기
    const urlParams = new URLSearchParams(window.location.search);
    const cocktail = urlParams.get('cocktail');

    const menuDetails = {
        mojito: {
            name: '모히또',
            image: '/images/mojito2.jpg',
            description: '상큼한 민트향과 새콤달콤한 라임향의 조화!<br>화이트럼 + 라임주스 + 애플민트 + 설탕 + 탄산수',
            price: '12,000원'
        },
        screwdriver: {
            name: '스크류 드라이버',
            image: '/images/Screwdriver.jpg',
            description: '상큼한 오렌지와 보드카의 깔끔한 조화, 가볍고 부드러운 한잔!<br>보드카 + 오렌지주스 + 오렌지',
            price: '15,000원'
        },
        tequilaSunrise: {
            name: '데킬라 선라이즈',
            image: '/images/TequilaSunrise.jpg',
            description: '달콤한 오렌지와 그레나딘 시럽이 어우러진, 부드럽고 화려한 한잔!<br>데킬라 + 오렌지주스 + 오렌지 + 체리 + 그레다닌 시럽',
            price: '12,000원'
        },
        magarita: {
            name: '마가리타',
            image: '/images/Margarita.jpg',
            description: '상큼한 라임과 테킬라의 조화, 산뜻하고 시원한 한잔!<br>데킬라 + 쿠앵트로 + 소금 + 라임',
            price: '14,000원'
        },
        martini: {
            name: '마티니',
            image: '/images/Martini.jpg',
            description: '진과 드라이 베르무트가 어우러진, 깔끔하고 클래식한 한잔!<br>진 + 드라이 베르무트 + 올리브',
            price: '15,000원'
        },
        sangria: {
            name: '샹그리아',
            image: '/images/Sangria.jpg',
            description: '과일과 와인의 풍미가 조화를 이루는 달콤하고 상큼한 한잔!<br>레드와인 + 브랜디 + 설탕 + 오렌지 + 레몬',
            price: '10,000원'
        },
        jackcoke: {
            name: '잭콕',
            image: '/images/JackCoke.jpg',
            description: '부드럽고 진한 오크 향, 달콤하면서도 스모키한 풍미가 돋보이는 한잔!<br>잭다니엘 + 콜라',
            price: '7,000원'
        },
    };

    // 선택된 칵테일에 맞는 내용으로 업데이트
    if (cocktail && menuDetails[cocktail]) {
        const details = menuDetails[cocktail];
        document.getElementById('menu-name').textContent = details.name;
        document.getElementById('menu-image').src = details.image;
        document.getElementById('menu-description').innerHTML = details.description;
        document.getElementById('menu-price').textContent = details.price;
    } else {
        document.getElementById('menu-name').textContent = '메뉴를 찾을 수 없습니다';
    }

    function goBack() {
        window.history.back();
    }

    function addToCart() {
        // 메뉴 아이템을 로컬 스토리지에 추가
        const cart = JSON.parse(localStorage.getItem('cart')) || [];
        const menuItem = {
            name: document.getElementById('menu-name').textContent,
            price: document.getElementById('menu-price').textContent
        };
        cart.push(menuItem);
        localStorage.setItem('cart', JSON.stringify(cart));

        alert('장바구니에 담겼습니다!');
    }

    function goList() {
        window.location.href = "csPages/cart";  // 장바구니 페이지로 이동
    }
</script>
</body>
</html>
