<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>메뉴 목록</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link rel="stylesheet" href="/css/sidebar-footer.css">
  <script src="/js/status.js"></script>
  <script>
    function toggleSubmenu() {
      var submenu = document.getElementById("sales-submenu");
      submenu.classList.toggle("active"); // 활성화/비활성화 토글
    }
  </script>
</head>
<body>

<!-- ✅ 사이드바 -->
<aside class="sidebar">
  <a href="/dashboard">홈으로</a>
  <div class="menu-group">
    <a href="/dashboard">대시보드</a>
    <a href="/hrm">인사관리</a>
    <div class="menu-item" onclick="toggleSubmenu()">판매</div>
    <div class="submenu" id="sales-submenu">
      <a href="/SalesMenuList">메뉴관리</a>
      <a href="/InvenList">재고관리</a>
      <a href="/OrderList">발주관리</a>
      <a href="/Suppliers">거래업체관리</a>
    </div>
    <a href="/accounting">회계</a>
  </div>

  <!-- ✅ 정보 수정 & 로그아웃 -->
  <div class="info-update">
    <a href="/confirmPw">정보 수정</a>
  </div>
  <form action="/logout" method="post" class="logout-form">
    <button type="submit">로그아웃</button>
  </form>
</aside>

<!-- ✅ 메인 콘텐츠 -->
<div class="content">
  <h2 class="text-center">메뉴 목록</h2>

  <div class="d-flex justify-content-end mb-3">
    <button onclick="location.href='/NewMenuFrm'" class="btn btn-primary">새 메뉴 등록</button>
  </div>

  <!-- ✅ 성공/에러 메시지 출력 -->
  <div th:if="${message}" class="alert alert-success text-center">
    <p th:text="${message}" class="mb-0"></p>
  </div>
  <div th:if="${errorMessage}" class="alert alert-danger text-center">
    <p th:text="${errorMessage}" class="mb-0"></p>
  </div>

  <!-- ✅ 테이블 -->
  <table class="table table-striped table-bordered text-center">
    <thead class="table-dark">
    <tr>
      <th>번호</th>
      <th>메뉴 이름</th>
      <th>등록/수정일자</th>
      <th>상태</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="menu, iterStat : ${menuList}">
      <td>
        <a th:href="@{/menu/detail/{menuId}(menuId=${menu.menuId})}"
           th:text="${totalMenus - ((currentPage - 1) * pageSize) - iterStat.index}">
        </a>
      </td>
      <td>
        <a th:href="@{/menu/detail/{menuId}(menuId=${menu.menuId})}"
           th:text="${menu.name}">
        </a>
      </td>
      <td th:text="${menu.registrationDate != null ? #temporals.format(menu.registrationDate, 'yyyy/MM/dd') : '날짜 없음'}"></td>
      <td>
        <span class="menu-status"
              th:classappend="${menu.status == '판매중'} ? 'status-available' : (${menu.status == '품절'} ? 'status-soldout' : 'status-unknown')"
              th:text="${menu.status != null ? menu.status : '알 수 없음'}">
        </span>
      </td>
    </tr>
    </tbody>
  </table>

  <!-- ✅ 페이징 -->
  <nav>
    <ul class="pagination justify-content-center">
      <li class="page-item" th:if="${currentPage > 1}">
        <a class="page-link" th:href="@{/SalesMenuList(page=${currentPage - 1}, pageSize=${pageSize})}">이전</a>
      </li>
      <li class="page-item" th:each="pageNum : ${#numbers.sequence(1, totalPages)}"
          th:classappend="${pageNum == currentPage} ? 'active'">
        <a class="page-link" th:href="@{/SalesMenuList(page=${pageNum}, pageSize=${pageSize})}"
           th:text="${pageNum}">
        </a>
      </li>
      <li class="page-item" th:if="${currentPage < totalPages}">
        <a class="page-link" th:href="@{/SalesMenuList(page=${currentPage + 1}, pageSize=${pageSize})}">다음</a>
      </li>
    </ul>
  </nav>
</div>

<!-- ✅ 푸터 -->
<footer>
  <p>문의사항: admin1@gmail.com</p>
</footer>

</body>
</html>
