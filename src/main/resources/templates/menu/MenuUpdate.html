<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>메뉴 수정</title>
    <!-- ✅ Bootstrap 및 커스텀 CSS 적용 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="/css/sidebar-footer.css">
    <script src="/js/status.js"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        /* ✅ 전체 레이아웃 스타일 */
        body {
            display: flex;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
        }

        /* ✅ 사이드바 스타일 */
        .sidebar {
            width: 250px;
            height: 100vh;
            background: #212529;
            color: white;
            padding: 20px;
            position: fixed;
        }

        .sidebar a {
            color: white;
            text-decoration: none;
            display: block;
            padding: 10px 15px;
        }

        .sidebar a:hover {
            background: #495057;
            border-radius: 5px;
        }

        /* ✅ 메인 컨텐츠 */
        .main-content {
            margin-left: 270px;
            width: calc(100% - 270px);
            padding: 30px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 4px 6px rgba(0, 0, 0, 0.1);
        }

        /* ✅ 푸터 */
        footer {
            position: fixed;
            bottom: 0;
            left: 250px;
            width: calc(100% - 250px);
            background: #212529;
            color: white;
            text-align: right;
            padding: 10px;
        }
    </style>
</head>

<body>
<!-- ✅ 사이드바 -->
<div class="sidebar">
    <h4>메뉴 관리</h4>
    <a href="/dashboard">홈으로</a>
    <a href="#" data-bs-toggle="collapse" data-bs-target="#salesMenu">판매</a>
    <div class="collapse" id="salesMenu">
        <a href="/SalesMenuList" class="ms-3">메뉴 목록</a>
        <a href="#" class="ms-3">재고 목록</a>
    </div>
    <a href="#" data-bs-toggle="collapse" data-bs-target="#partnerMenu">거래 업체</a>
    <div class="collapse" id="partnerMenu">
        <a href="#" class="ms-3">거래 업체 목록</a>
    </div>
    <a href="#" data-bs-toggle="collapse" data-bs-target="#orderMenu">발주</a>
    <div class="collapse" id="orderMenu">
        <a href="#" class="ms-3">발주 목록</a>
        <a href="#" class="ms-3">발주 신청</a>
    </div>
    <a href="#">정보 수정</a>
    <a href="#" class="mt-auto">로그아웃</a>
</div>

<!-- ✅ 본문 컨테이너 -->
<div class="main-content">
    <h2 class="text-center mb-4">메뉴 수정</h2>

    <div class="card">
        <form id="updateMenuForm" action="/menu/update" method="post" enctype="multipart/form-data">
            <input type="hidden" id="menuId" name="menuId" th:value="${menu.menuId}">

            <!-- ✅ 이미지 업로드 -->
            <div class="mb-3 text-center">
                <label class="form-label">이미지:</label>
                <input type="file" id="photoInput" name="photo" accept="image/*" class="form-control" onchange="previewImage(event)">
                <img id="photoPreview" th:src="${menu.photoPath}" alt="Menu Image" class="mt-2 img-thumbnail" style="max-width: 200px;">
            </div>

            <!-- ✅ 메뉴 이름 -->
            <div class="mb-3">
                <label class="form-label">메뉴 이름:</label>
                <input type="text" id="name" name="name" th:value="${menu.name}" required class="form-control">
            </div>

            <!-- ✅ 가격 -->
            <div class="mb-3">
                <label class="form-label">가격:</label>
                <input type="number" id="price" name="price" th:value="${menu.price}" required class="form-control">
            </div>

            <!-- ✅ 설명 -->
            <div class="mb-3">
                <label class="form-label">설명:</label>
                <textarea id="description" name="description" required class="form-control" th:text="${menu.description}"></textarea>
            </div>

            <!-- ✅ 알러지 정보 -->
            <div class="mb-3">
                <label class="form-label">알러지 정보:</label>
                <input type="text" id="allergyIngredients" name="allergyIngredients" th:value="${menu.allergyIngredients}" class="form-control">
            </div>

            <!-- ✅ 상태 (라디오 버튼) -->
            <div class="mb-3">
                <label class="form-label">상태:</label>
                <div>
                    <input type="radio" id="status1" name="status" value="판매중" th:checked="${menu.status.name() == '판매중'}">
                    <label for="status1" class="status-available">판매중</label>

                    <input type="radio" id="status2" name="status" value="품절" th:checked="${menu.status.name() == '품절'}">
                    <label for="status2" class="status-soldout">품절</label>
                </div>
            </div>

            <!-- ✅ 수정 버튼 -->
            <button type="submit" class="btn btn-primary w-100">수정</button>
        </form>
    </div>
</div>

<!-- ✅ 푸터 -->
<footer>
    문의사항: admin1@gmail.com
</footer>

<!-- ✅ JavaScript: 이미지 미리보기 -->
<script>
    function previewImage(event) {
        const input = event.target;
        const preview = document.getElementById('photoPreview');
        if (input.files && input.files[0]) {
            const reader = new FileReader();
            reader.onload = function(e) {
                preview.src = e.target.result;
                preview.style.display = 'block';
            };
            reader.readAsDataURL(input.files[0]);
        } else {
            preview.src = document.getElementById('photoPreview').getAttribute('th:src'); // 기존 이미지 유지
            preview.style.display = 'block';
        }
    }
</script>

</body>
</html>
