<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>재고 상세 정보</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/common.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .content-wrapper {
            display: flex;
            flex-grow: 1;
            justify-content: center;
            align-items: center;
            min-height: 70vh;
        }
        .container {
            max-width: 50%;
            min-height: 60vh;
            padding: 40px;
            border-radius: 15px;
            background-color: #fff;
            box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.1);
            border: 2px solid #ff00ff;
            text-align: center;
        }
        .form-label {
            font-weight: bold;
            font-size: 1.2rem;
            text-align: center;
            display: block;
        }
        .badge {
            font-size: 1rem;
            padding: 8px 12px;
        }
        .btn {
            font-size: 1.2rem;
            padding: 12px 20px;
            border-radius: 10px;
        }
        .btn-danger {
            background-color: #ff4d4d;
            border-color: #ff0000;
        }
        footer {
            margin-top: auto;
            padding: 10px;
            text-align: center;
            background-color: #000;
            color: white;
        }
        .text-center-input {
            text-align: center;
        }
    </style>
</head>
<body>

<!-- ✅ 사이드바 -->
<aside>
    <a href="/dashboard">홈으로</a>
    <div class="menu-group">
        <a href="/dashboard">대시보드</a>
        <a href="/hrm">인사관리</a>
        <div class="menu-item" onclick="toggleSubmenu()">판매</div>
        <div class="submenu" id="sales-submenu">
            <a href="/SalesMenuList">메뉴관리</a>
            <a href="/InvenList">재고관리</a>
            <a href="/orders">발주</a>
            <a href="/suppliers">거래업체</a>
        </div>
        <a href="/accounting">회계</a>
    </div>
    <div class="info-update">
        <a href="/confirmPw">정보수정</a>
    </div>
    <form action="/logout" method="post" class="logout-form">
        <button type="submit">로그아웃</button>
    </form>
</aside>

<!-- ✅ 중앙 컨텐츠 -->
<div class="content-wrapper">
    <div class="container">
        <h2 class="fw-bold">
            <span th:text="${invenDto?.name ?: '이름 없음'}"></span>
            <span class="text-muted" th:if="${invenDto?.englishName != null}" th:text="'(' + ${invenDto.englishName} + ')'"></span>
        </h2>

        <!-- ✅ 추가된 Ingredient ID 출력 -->
        <p th:text="'Ingredient ID: ' + ${invenDto?.ingredientId}"></p>

        <div class="mb-4">
            <label class="form-label">종류:</label>
            <span class="badge bg-primary" th:text="${invenDto?.category ?: '미분류'}">카테고리</span>
        </div>

        <div class="mb-4">
            <label class="form-label">단위:</label>
            <input type="text" class="form-control text-center-input" th:value="${invenDto?.unit ?: '데이터 없음'}" readonly>
        </div>

        <div class="mb-4">
            <label class="form-label">재고 수량:</label>
            <input type="text" class="form-control text-center-input" th:value="${invenDto?.quantity ?: '데이터 없음'}" readonly>
        </div>

        <div class="text-center mt-4">
            <!-- ✅ 수정 버튼 -->
            <div class="text-center mt-4">
                <a th:if="${invenDto?.ingredientId != null}"
                   th:href="@{/inventory/InvenEdit(ingredientId=${invenDto.ingredientId})}"
                   class="btn btn-warning">
                    수정
                </a>
            </div>
        </div>

        <div class="mb-4">
            <label class="form-label">재고 상태:</label>
            <span id="inventoryStatus" class="status-class"
                  th:text="${invenDto?.status ?: '알 수 없음'}"
                  th:classappend="${invenDto?.status == '품절' ? 'text-danger' :
                          (invenDto?.status == '재고 부족' ? 'text-warning' : 'text-success')}">
            </span>
        </div>

        <!-- ✅ 푸터 -->
        <footer>
            <p>문의사항: admin1@gmail.com</p>
        </footer>
    </div>
</div>

</body>
</html>
