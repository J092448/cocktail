<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org/">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link rel="stylesheet" href="/adminHeader.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        .notice-container {
            background: #ffffff;
            padding: 20px;
            border-radius: 10px;
            width: 60%;
            margin: auto;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.1);
        }

        .notice-title {
            font-size: 24px;
            font-weight: bold;
            color: #333;
            text-align: center;
            margin-bottom: 20px;
        }

        .notice-info {
            background: #f9f9f9;
            padding: 10px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            color: #555;
        }

        .notice-content {
            padding: 20px;
            background: #f5f5f5;
            border-radius: 5px;
            margin-top: 15px;
        }

        .notice-heading {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .notice-text {
            font-size: 16px;
            color: #333;
            white-space: pre-line;
        }

        .status-container {
            text-align: center;
            margin-top: 15px;
        }

        .status-badge {
            padding: 8px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
        }

        .active {
            background-color: #28a745;
            color: white;
        }

        .inactive {
            background-color: #dc3545;
            color: white;
        }

        .btn-container {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        .btn {
            padding: 10px 15px;
            font-size: 16px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
        }

        .btn-primary {
            background: #007bff;
            color: white;
        }

        .btn-primary:hover {
            background: #0056b3;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-danger:hover {
            background: #c82333;
        }
    </style>
</head>
<body>
<div th:replace="fragments::adminHeader"></div>
<div class="notice-container">
    <h2 class="text-center notice-title"
        onclick="location.href='/admin/noticeList'"
        style="cursor:pointer;">📢 공지사항</h2>

    <div class="notice-info">
        <span><strong>📅 등록일:</strong> <span th:text="${#temporals.format(notice.created_at, 'yyyy.MM.dd HH:mm')}"></span></span>
        <span><strong>✏ 수정일:</strong> <span th:text="${#temporals.format(notice.updated_at, 'yyyy.MM.dd HH:mm')}"></span></span>
        <span><strong>⏳ 만료일:</strong> <span th:text="${notice.deadline}"></span></span>
    </div>

    <div class="notice-content">
        <h4 class="notice-heading" th:text="${notice.notice_title}"></h4>
        <p class="notice-text" th:text="${notice.notice_contents}"></p>
    </div>

    <div class="status-container">
        <span th:class="${notice.status} == 'ACTIVE' ? 'status-badge active' : 'status-badge inactive'"
              th:text="${notice.status} == 'ACTIVE' ? '✅ 활성화' : '❌ 비활성화'">
        </span>
    </div>

    <div class="btn-container">
        <button class="btn btn-primary"
                th:onclick="|location.href='/admin/editNotice?notice_num=${notice.notice_num}'|">수정</button>
        <button class="btn btn-danger" id="deleteBtn">삭제</button>
    </div>
</div>
<div th:replace="~{fragments::footer}"></div>
<script >
    $('#deleteBtn').click(() => {
        if (confirm('삭제하시겠습니까?')){
            location.href = '/admin/deleteNotice?notice_num=' + [[${notice.notice_num}]]
        }
    })
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
