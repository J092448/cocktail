<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org/">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.7.1/dist/chart.min.js"></script>
    <script th:inline="javascript">
        $(() => {
            const msg = [[${msg}]]
            if (msg != null) {
                alert(msg)
            }
        })
    </script>
    <link rel="stylesheet" href="/adminHeader.css">
    <style>
        .content {
            flex-grow: 1;
            padding: 20px;
            margin-left: 220px;
        }
        .stats-container {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }
        .card {
            width: 48%;
            padding: 20px;
            margin: 50px;
            border-radius: 10px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
        }
        .signup-card { background: #f8caca; color: #b22222; }
        .total-card { background: #cce5ff; color: #004085; }
        .chart-container {
            display: flex;
            justify-content: space-between;
        }
        .chart-box {
            width: 48%;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        footer {
            position: fixed;
            bottom: 0;
            left: 200px;
            width: calc(100% - 200px);
            background: black;
            color: white;
            text-align: right;
            padding: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>
<div th:replace="~{fragments::adminHeader}"></div>

<div class="content">
    <div class="stats-container">
        <div class="card signup-card">오늘의 가입자 수
        <div th:text="${visitor}"></div>
        </div>
        <div class="card total-card">누적 가입자 수
        <div th:text="${singup}"></div>
        </div>
    </div>
    <div class="chart-container">
        <div class="chart-box">
            <canvas id="visitorsChart"></canvas>
        </div>
        <div class="chart-box">
            <canvas id="signupsChart"></canvas>
        </div>
    </div>
</div>
<div th:replace="~{fragments::footer}"></div>
<script th:inline="javascript">
    const dates = [[${weekly.![date]}]]
    const visitors = [[${weekly.![total_visitors]}]]
    const signups = [[${weekly.![new_users]}]]
    console.log(dates, visitors, signups)

    const ctxVisitors = $('#visitorsChart')[0].getContext('2d')
    new Chart(ctxVisitors, {
        type: 'bar',
        data: {
            labels: dates,
            datasets: [{
                label: '일일 방문자 수',
                data: visitors,
                backgroundColor: 'rgba(235,199,54,0.5)',
                borderColor: 'rgb(235,193,54)',
                borderWidth: 1
            }]
        },
        options: {
            responsive: true,
            scales: {
                y: {beginAtZero: true}
            }
        }
    })
    const ctxSignups = $('#signupsChart')[0].getContext('2d')
    new Chart(ctxSignups, {
        type: 'bar',
        data: {
            labels: dates,
            datasets: [{
                label: '일일 가입자 수',
                data: signups,
                backgroundColor: 'rgba(235,129,54,0.5)',
                borderColor: 'rgb(255,136,51)',
                borderWidth: 1
            }]
        },
        options: {
            responsive: true,
            scales: {
                y: {beginAtZero: true}
            }
        }
    })
</script>
</body>
</html>
