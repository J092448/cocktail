# ? ?????? ??
spring.application.name=tlqkf

# ? ?? ?? ??
server.port=80



# ? MySQL ??
spring.datasource.url=jdbc:mysql://192.168.0.24:3306/cocktail_bar_erp?characterEncoding=UTF-8&serverTimezone=Asia/Seoul
spring.datasource.username=ontherocks
spring.datasource.password=1111
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ? MyBatis ??
mybatis.mapper-locations=classpath:mappers/**/*.xml
mybatis.type-aliases-package=com.ontherocks.tlqkf.model
mybatis.configuration.map-underscore-to-camel-case=true

# Spring MVC ??
spring.mvc.contentnegotiation.favor-path-extension=false


# CORS ?? ??
spring.web.cors.allow-credentials=true


server.servlet.context-path=

# ? ?? ??
logging.level.root=INFO
logging.level.com.ontherocks=DEBUG
logging.level.org.apache.ibatis=DEBUG
logging.level.org.springframework=DEBUG
logging.level.org.springframework.web=DEBUG


# ? ?? ??? ??
spring.web.resources.static-locations=classpath:/static/
spring.thymeleaf.cache=false

spring.mvc.view.prefix=classpath:/templates/
spring.mvc.view.suffix=.html
management.endpoints.web.exposure.include=mappings

# Hibernate ??
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Spring Boot 3.2+?? ??? ?????? ??
spring.mvc.problemdetails.enabled=true
server.error.include-message=always
spring.web.resources.add-mappings=false
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.default-property-inclusion=non_null
server.error.whitelabel.enabled=false

# JMS ?? (??)
spring.jms.pub-sub-domain=true


